<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="San Gabriel App — Panadería San Gabriel" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="San Gabriel App" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>San Gabriel App</title>
    <style>
      /* Pantalla de carga estática (puro HTML/CSS, sin React todavía).
         Se ve mientras el bundle de JS termina de cargar/parsear, con el
         mismo diseño del login (cuadrícula + "SG" con pulso) para que la
         transición entre el splash nativo del SO y la app sea uniforme
         — sin blancos ni cambios de tono de por medio. React reemplaza
         este contenido automáticamente al montar sobre #root. */
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        z-index: 9999;
      }
      .app-loading::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.035;
        background-image: linear-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.8) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .app-loading__badge {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        background: #020617;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 700 20px/1 system-ui, -apple-system, sans-serif;
        color: #fff;
        animation: app-loading-pulse 1.6s ease-in-out infinite;
      }
      @keyframes app-loading-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.35);
        }
        50% {
          box-shadow: 0 0 0 10px rgba(244, 63, 94, 0);
        }
      }
    </style>
    <script>
      // Aplica el tema (claro/oscuro) ANTES del primer render, para que
      // no haya un parpadeo del tema equivocado al cargar la página.
      // Esta es la única lógica de tema que vive fuera de React —
      // src/shared/theme/useTheme.ts lee este mismo estado al montar.
      //
      // Por defecto es OSCURO si no hay preferencia guardada (no se
      // respeta prefers-color-scheme): así el splash screen, la barra
      // de estado del teléfono y el contenido son el mismo azul-marino
      // #020617 desde la primera carga, sin flashes en blanco.
      //
      // El theme-color SIEMPRE arranca en #020617 (navy del login) sin
      // importar el tema guardado — la pantalla de login lo necesita
      // fijo así. Si el usuario ya tenía sesión y su tema es claro, el
      // AppShell lo corrige a blanco apenas monta (ver AppShell.tsx).
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored ? stored === 'dark' : true;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          /* localStorage no disponible (modo privado, etc.) — usa oscuro por defecto */
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-ink antialiased overscroll-none">
    <div id="root">
      <div class="app-loading" aria-hidden="true">
        <div class="app-loading__badge">SG</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
